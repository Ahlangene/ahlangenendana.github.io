  website:  ""

# ── About ──────────────────────────────────────────────────────────────
# Use | for multi-line text. Indent each line by 2 spaces.
about: |
  Computer Engineering Honours graduate with hands-on first-line IT support experience assisting ~25 users across 35 devices with Windows, hardware, Microsoft 365 and peripheral issues. Skilled in systematic troubleshooting, hardware upgrades, device configuration, data backup and clear user communication. Current City of Cape Town role adds Excel, SharePoint, documentation and stakeholder coordination experience. Google IT Support Certified, with practical Python/Java project experience as technical depth. Seeking an entry-level IT Support Engineer or Service Desk role.
  
# ── Stats ──────────────────────────────────────────────────────────────
# Customise each label and value freely — change "Projects Shipped" to
# "Active Customers", "Happy Clients", "Open Source Stars", etc.
# Optional fields: prefix (e.g. "$") and suffix (e.g. "+" or "k").
# Remove all entries or set show: false above to hide this section.
# stats:
    - { label: "Software Projects", value: 2, suffix: "" }
    - { label: "Certifications", value: 2, suffix: "" }

# Examples of other combinations you can use:
#   - { label: "Active Users",    value: 10000, suffix: "+" }
#   - { label: "Revenue",         value: 2,     prefix: "$", suffix: "M+" }
