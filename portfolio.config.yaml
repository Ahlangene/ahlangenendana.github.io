# ── Experience ─────────────────────────────────────────────────────────
experience:
  - company: "City of Cape Town"
    role: "Adminstrator Support"
    period: "March 2026 – Present"
    description: |
      What I did: Supported 8 infrastructure projects by coordinating 
      information between project managers, contractors, and community 
      stakeholders.
      The problem: Project close-out documentation was incomplete, which 
      risked audit findings and delayed payments.
      What I did about it: I reconciled project quantities against payment 
      records to surface discrepancies, then generated or updated 17 close-out 
      reports to fill the gaps.
    Outcome: Improved the completeness of project records and supported audit readiness across 8 projects, while coordinating ~30 stakeholders.
    highlights:
      - Ms Word
      - Ms Excel
      - Records Management
      - Audit Preparation

  - company: "Independent"
    role: "IT Support"
    period: "January 2025 - December 2025"
    description: |
      Built real-time collaboration features for a SaaS platform serving
      50k users. Owned the entire frontend from scratch.
      What I did: Supported 8 infrastructure projects by coordinating 
      information between project managers, contractors, and community 
      stakeholders.
      What I did: Provided first-line technical support to ~25 users across 35 devices, primarily onsite.
      The interesting part: Most issues weren't obvious—OneDrive sync failures, audio/connectivity problems, OS installs, HDD-to-SSD upgrades. I had to gather information, form a hypothesis, apply a fix, and verify with the user.
    Outcome: Kept 25 users productive across 35 devices, and built a habit of explaining technical solutions in plain language.
    highlights:
      - Troubleshooting
      - 25 users
      - Windows and Linux
      - MS Office

